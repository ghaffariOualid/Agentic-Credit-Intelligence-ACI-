[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aci-platform"
version = "0.1.0"
description = "Agentic Credit Intelligence — Plateforme distribuée d'analyse financière et d'optimisation d'agents IA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "openpyxl>=3.1.2",
    "langgraph>=0.2.50",
    "numpy>=1.26.0",
    "gymnasium>=0.29.0",
    "torch>=2.2.0",
    "python-multipart>=0.0.9",
    "pypdf>=5.0.0",
    "reportlab>=4.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["services*", "agents*", "intelligence*", "datasets*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
